name: Release

on:
  push:
    branches:
      - main
      # Add more environments here, e.g.:
      # - beta
      # - alpha

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write  # Required for npm provenance (OIDC, no NPM_TOKEN needed)

jobs:
  release:
    runs-on: ubuntu-latest
    container: debian:latest

    steps:
      - name: Install system dependencies
        run: |
          apt-get update
          apt-get install -y git curl ca-certificates gnupg lsb-release

      - name: Install Node.js
        run: |
          curl -fsSL https://deb.nodesource.com/setup_22.x | bash -
          apt-get install -y nodejs

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Configure Git in container
        run: |
          git config --global --add safe.directory '/__w/core-ts/core-ts'
          git config --global user.name 'github-actions[bot]'
          git config --global user.email '41898282+github-actions[bot]@users.noreply.github.com'

      - name: Verify installation
        run: |
          git --version
          node --version
          npm --version
          git status

      - name: Install dependencies
        run: npm ci

      # semantic-release lives outside the root dependency tree: it pulls the
      # `npm` CLI, whose bundled deps carry advisories with no fixed release,
      # which would fail the `npm audit` gate in ci.yml. Installed here instead,
      # pinned by tools/release/package-lock.json.
      - name: Install release tooling
        run: npm ci --prefix tools/release

      - name: Verify semantic-release is installed
        run: ls -la tools/release/node_modules/@semantic-release/

      - name: Build
        run: npm run build

      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Publish to npm via OIDC provenance — no NPM_TOKEN needed.
          # Requirement: enable "Trusted Publishing" for this repo on npmjs.com
          # (Account → Package → Settings → Publish granular access token / OIDC)
          NPM_CONFIG_PROVENANCE: 'true'
        # Runs from the repo root, so package.json, CHANGELOG.md and git assets
        # resolve exactly as before; only the tooling comes from the prefix.
        run: npx --prefix tools/release semantic-release