name: CI

on:
  pull_request:
    types: [opened, reopened, synchronize]
  # Pull requests are checked by the pull_request event; a push to every branch would run the same checks a second
  # time for each of them. main is checked again after each merge.
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  dependency-safety:
    name: Dependency Safety
    runs-on: ubuntu-latest
    container: debian:latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: 'package.json'
          cache: npm

      - run: npm ci --ignore-scripts
      - run: npm audit signatures
      - run: npm audit --audit-level=high

  checks:
    name: Lint and Tests
    runs-on: ubuntu-latest
    container: debian:latest
    needs: dependency-safety
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: 'package.json'
          cache: npm

      - run: npm ci
      - run: npm run style:dry
      - run: npm test
