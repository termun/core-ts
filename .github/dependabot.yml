version: 2

updates:
  # Npm dependecies updates
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    groups:
      devDependencies:
        dependency-type: "development"
      dependencies:
        dependency-type: "production"
    # semantic-release reads the commit type: production dependencies ship in
    # @termun/core, so their updates are a fix and release a patch; dev
    # dependencies do not reach users and release nothing.
    commit-message:
      prefix: "fix"
      prefix-development: "chore"
      include: "scope"

  # Release tooling updates, kept out of the main dependency tree
  - package-ecosystem: "npm"
    directory: "/tools/release"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    # CI-only tooling: never part of the published package, never a release.
    commit-message:
      prefix: "chore"
      include: "scope"
    # conventional-changelog-conventionalcommits 10 needs conventional-changelog-writer 9, which
    # @semantic-release/release-notes-generator 14 does not use yet: up to 10.3 the release notes come out
    # empty, from 10.4 they fail to render.
    ignore:
      - dependency-name: "conventional-changelog-conventionalcommits"
        versions: [">=10.0.0"]

  # GitHub Actions updates
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore"
      include: "scope"
